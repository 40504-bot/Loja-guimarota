
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horário e Férias</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status {
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
    }
    .aberto { background-color: #d4edda; color: #155724; }
    .fechado { background-color: #f8d7da; color: #721c24; }
    .ferias { background-color: #fff3cd; color: #856404; }
    .aviso-ferias {
      margin-top: 15px;
      padding: 10px;
      background-color: #e2e3e5;
      border-radius: 5px;
      color: #383d41;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Horário de Funcionamento</h2>
    
    <p><strong>Segunda-feira:</strong> 14:00 – 19:00</p>
    <p><strong>Terça a Sexta-feira:</strong> 10:00 – 13:00 | 14:00 – 19:00</p>
    <p><strong>Sábado:</strong> 10:00 – 13:00</p>
    <p><strong>Domingo:</strong> Fechado</p>

    <div id="status-loja" class="status"></div>

    <div id="mensagem-personalizada"></div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ ÁREA DE CONFIGURAÇÃO (EDITA AQUI AS TUAS FÉRIAS E FRASES)
    // =========================================================================
    
    // 1. FÉRIAS: Altera para true se estiveres de férias, ou false se estiveres a trabalhar
    const EM_FERIAS = false; 

    // 2. MENSAGEM DE FÉRIAS: Escreve a frase que queres mostrar durante as férias
    const MENSAGEM_FERIAS = "Encontramo-nos encerrados para férias. Voltamos em breve!";

    // 3. FRASE EXTRA/AVISO: Podes escrever aqui qualquer frase (ex: "Entregas em 24h", etc.)
    // Se não quiseres nenhuma frase extra, deixa as aspas vazias ""
    const FRASE_PERSONALIZADA = "Obrigado pela sua visita!";

    // =========================================================================
    // 🚫 NÃO PRECISAS DE MEXER NO CÓDIGO ABAIXO
    // =========================================================================
    function atualizarStatus() {
      const agora = new Date();
      const diaSemana = agora.getDay(); // 0 = Domingo, 1 = Segunda, ..., 6 = Sábado
      const horaAtual = agora.getHours() + agora.getMinutes() / 60;

      const statusElement = document.getElementById("status-loja");
      const msgElement = document.getElementById("mensagem-personalizada");

      // Se estiver de férias ativado
      if (EM_FERIAS) {
        statusElement.textContent = "Encerrado para Férias";
        statusElement.className = "status ferias";
        msgElement.innerHTML = `<div class="aviso-ferias">${MENSAGEM_FERIAS}</div>`;
        return;
      }

      let aberto = false;

      // Segunda-feira (1)
      if (diaSemana === 1) {
        if (horaAtual >= 14 && horaAtual < 19) aberto = true;
      }
      // Terça (2) a Sexta (5)
      else if (diaSemana >= 2 && diaSemana <= 5) {
        if ((horaAtual >= 10 && horaAtual < 13) || (horaAtual >= 14 && horaAtual < 19)) {
          aberto = true;
        }
      }
      // Sábado (6)
      else if (diaSemana === 6) {
        if (horaAtual >= 10 && horaAtual < 13) aberto = true;
      }

      // Atualiza o estado visual
      if (aberto) {
        statusElement.textContent = "Aberto Agora";
        statusElement.className = "status aberto";
      } else {
        statusElement.textContent = "Fechado Agora";
        statusElement.className = "status fechado";
      }

      // Mostra a frase personalizada se existir
      if (FRASE_PERSONALIZADA !== "") {
        msgElement.innerHTML = `<p style="margin-top: 15px; font-style: italic;">${FRASE_PERSONALIZADA}</p>`;
      } else {
        msgElement.innerHTML = "";
      }
    }

    // Executa a função ao carregar a página
    atualizarStatus();
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katy Fashion K</title>
  <style>
    body {
      background-color: #080808;
      color: #D4AF37;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a1a, #000000);
      width: 100%;
      padding: 30px 40px;
      border-bottom: 4px solid #D4AF37;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3.2em;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #FFDF00;
    }
    .container {
      max-width: 750px;
      width: 90%;
      margin: 30px auto;
      padding: 35px;
      background-color: #141414;
      border: 2px solid #D4AF37;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      box-sizing: border-box;
    }
    h2 {
      color: #FFDF00;
      font-size: 1.8em;
      border-bottom: 2px dashed #D4AF37;
      padding-bottom: 12px;
      margin-bottom: 25px;
    }
    .morada-card {
      background-color: #1a1a1a;
      border: 1px solid #D4AF37;
      padding: 15px 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      text-align: center;
    }
    .morada-card p {
      margin: 5px 0;
      color: #fff;
      font-size: 1.1em;
    }
    .horario-card {
      background-color: #1f1f1f;
      border-left: 5px solid #D4AF37;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .horario-card strong {
      color: #fff;
      font-size: 1.1em;
    }
    .horario-card span {
      color: #D4AF37;
      font-weight: bold;
    }
    .ferias-box {
      background: linear-gradient(135deg, #2a2206, #141414);
      border: 2px solid #FFDF00;
      padding: 20px;
      border-radius: 12px;
      margin-top: 30px;
      text-align: center;
    }
    .admin-btn {
      background: transparent;
      color: #555;
      border: none;
      font-size: 0.8em;
      margin-top: 30px;
      cursor: pointer;
    }
    .admin-panel {
      display: none;
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
      margin-top: 15px;
      border: 1px solid #444;
      text-align: left;
    }
    .admin-panel input {
      width: 100%;
      padding: 8px;
      margin: 8px 0 15px 0;
      border-radius: 5px;
      border: 1px solid #555;
      background-color: #333;
      color: #fff;
      box-sizing: border-box;
    }
    .admin-panel button {
      background-color: #D4AF37;
      color: #000;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Katy Fashion K</h1>
  </header>

  <div class="container">
    
    <div class="morada-card">
      <p>📍 <strong>Nossa Loja:</strong> Rua Vale de Lobos, Guimarota</p>
    </div>

    <h2>Horário de Funcionamento</h2>

    <div class="horario-card">
      <strong>Segunda-feira</strong>
      <span>14:00 - 19:00</span>
    </div>

    <div class="horario-card">
      <strong>Terça a Sexta-feira</strong>
      <span>10:00 - 13:00 | 14:00 - 19:00</span>
    </div>

    <div class="horario-card">
      <strong>Sábado</strong>
      <span>10:00 - 13:00</span>
    </div>

    <div class="horario-card">
      <strong>Domingo</strong>
      <span style="color: #ff5555;">Encerrado</span>
    </div>

    <div class="ferias-box">
      <h3 style="margin-top:0; color:#FFDF00;">☀️ Férias ☀️</h3>
      <p id="texto-ferias" style="color: #fff; font-size: 1.1em;"></p>
    </div>

    <button class="admin-btn" onclick="abrirAdmin()">🔐 Painel Privado (Editar Férias)</button>

    <div id="painel-admin" class="admin-panel">
      <h3 style="color: #FFDF00; margin-top: 0;">Editar Férias da Loja</h3>
      
      <label>Data de Início das Férias:</label>
      <input type="text" id="input-inicio" placeholder="Ex: 01/08/2026">

      <label>Data de Fim das Férias:</label>
      <input type="text" id="input-fim" placeholder="Ex: 15/08/2026">

      <label>Data de Reabertura:</label>
      <input type="text" id="input-reabertura" placeholder="Ex: 16/08/2026">

      <button onclick="guardarDatas()">Guardar Alterações</button>
    </div>
  </div>

  <script>
    let inicio = localStorage.getItem('ferias_inicio') || "01/08/2026";
    let fim = localStorage.getItem('ferias_fim') || "15/08/2026";
    let reabertura = localStorage.getItem('ferias_reabertura') || "16/08/2026";

    function atualizarMensagem() {
      document.getElementById('texto-ferias').innerHTML = 
        `Estaremos encerrados para férias de <strong>${inicio}</strong> a <strong>${fim}</strong>.<br>` +
        `Reabrimos no dia <strong>${reabertura}</strong> com muitas novidades!`;
    }

    function abrirAdmin() {
      const pw = prompt("Escreve a palavra-passe para editar:");
      if (pw === "1234") {
        document.getElementById('painel-admin').style.display = "block";
        document.getElementById('input-inicio').value = inicio;
        document.getElementById('input-fim').value = fim;
        document.getElementById('input-reabertura').value = reabertura;
      } else if (pw !== null) {
        alert("Palavra-passe errada!");
      }
    }

    function guardarDatas() {
      inicio = document.getElementById('input-inicio').value;
      fim = document.getElementById('input-fim').value;
      reabertura = document.getElementById('input-reabertura').value;

      localStorage.setItem('ferias_inicio', inicio);
      localStorage.setItem('ferias_fim', fim);
      localStorage.setItem('ferias_reabertura', reabertura);

      atualizarMensagem();
      document.getElementById('painel-admin').style.display = "none";
      alert("Férias atualizadas com sucesso!");
    }

    atualizarMensagem();
  </script>

</body>
</html>
